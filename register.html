<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입</title>
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-container { background-color: #ffffff; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); width: 350px; text-align: center; }
        h2 { margin-bottom: 24px; color: #333333; }
        input { width: 100%; padding: 12px; margin-bottom: 16px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
        input:focus { border-color: #28a745; outline: none; }
        button { width: 100%; padding: 12px; background-color: #28a745; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #218838; }
        .links { margin-top: 20px; display: flex; justify-content: center; font-size: 13px; }
        .links a { color: #666666; text-decoration: none; }
        .links a:hover { text-decoration: underline; color: #28a745; }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>회원가입</h2>
        <form action="#">
            <input type="text" placeholder="이름 입력" required>
            <input type="email" placeholder="이메일 주소 입력" required>
            <input type="password" placeholder="비밀번호 입력" required>
            <button type="submit">가입하기</button>
        </form>
        <div class="links">
            <a href="index.html">이미 계정이 있으신가요? 로그인하기</a>
        </div>
    </div>
    <script>
        document.querySelector('form').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('회원가입이 완료되었습니다! 로그인 화면으로 이동합니다.');
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
