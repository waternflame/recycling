<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입</title>
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-container { background-color: #ffffff; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); width: 380px; text-align: center; }
        h2 { margin-bottom: 24px; color: #333333; }
        
        /* 입력창 텍스트 정렬 및 레이블 스타일 */
        .form-group { text-align: left; margin-bottom: 14px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: bold; color: #555; font-size: 13px; }
        
        /* input과 select 태그 스타일 통합 */
        input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; font-size: 14px; outline: none; }
        input:focus, select:focus { border-color: #28a745; }
        
        button { width: 100%; padding: 12px; background-color: #28a745; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        button:hover { background-color: #218838; }
        .links { margin-top: 20px; display: flex; justify-content: center; font-size: 13px; }
        .links a { color: #666666; text-decoration: none; }
        .links a:hover { text-decoration: underline; color: #28a745; }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>회원가입</h2>
        
        <!-- 충돌 방지를 위해 action="#" 속성을 제거했습니다 -->
        <form id="registerForm">
            <input type="text" placeholder="이름 입력" required style="margin-bottom: 14px;">
            <input type="email" placeholder="이메일 주소 입력" required style="margin-bottom: 14px;">
            <input type="password" placeholder="비밀번호 입력" required style="margin-bottom: 20px;">
            
            <!-- 💡 본인 확인 질문 선택 칸 추가 -->
            <div class="form-group">
                <label for="question">본인 확인 질문</label>
                <select id="question" required>
                    <option value="">질문을 선택해주세요</option>
                    <option value="q1">가장 기억에 남는 선생님 성함은?</option>
                    <option value="q2">처음 키웠던 반려동물의 이름은?</option>
                    <option value="q3">받았던 선물 중 가장 기억에 남는 것은?</option>
                    <option value="q4">가장 좋아하는 색깔은?</option>
                    <option value="q5">자신의 보물 제1호는?</option>
                    <option value="q6">자신의 인생 좌우명은?</option>
                    <option value="q7">가장 좋아하는 음식은?</option>
                    <option value="q8">어렸을 때 별명은?</option>
                    <option value="q9">처음 입학한 학교의 이름은?</option>
                    <option value="q10">인생에서 가장 기억에 남는 여행지는?</option>
                    <option value="q11">가장 즐겨듣는 음악은?</option>
                </select>
            </div>
            
            <!-- 💡 답변 입력 칸 추가 -->
            <div class="form-group">
                <label for="answer">답변 입력</label>
                <input type="text" id="answer" placeholder="답변을 입력하세요" required>
            </div>
            
            <button type="submit">가입하기</button>
        </form>
        
        <div class="links">
            <a href="index.html">이미 계정이 있으신가요? 로그인하기</a>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault(); // 폼 제출 시 브라우저 강제 새로고침 방지
            
            const question = document.getElementById('question').value;
            const answer = document.getElementById('answer').value.trim();
            
            if (question === "") {
                alert("본인 확인 질문을 선택해주세요.");
                return;
            }
            if (answer === "") {
                alert("답변을 입력해주세요.");
                return;
            }
            
            alert('회원가입이 완료되었습니다! 로그인 화면으로 이동합니다.');
            window.location.href = 'index.html'; // 안전하게 index.html로 이동
        });
    </script>
</body>
</html>
