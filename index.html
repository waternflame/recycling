<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인</title>
    <style>
        /* 기본 스타일 초기화 및 토스 감성의 부드러운 배경색 설정 */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "맑은 고딕", helvetica, sans-serif; 
            background-color: #f2f4f6; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            -webkit-font-smoothing: antialiased;
        }

        /* 토스 특유의 둥글고 입체감 있는 카드 디자인 */
        .login-container { 
            background-color: #ffffff; 
            padding: 48px 40px; 
            border-radius: 24px; 
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.03); 
            width: 360px; 
        }

        /* 타이틀: 왼쪽 정렬 및 두껍고 시원한 서체 */
        h2 { 
            margin: 0 0 32px 0; 
            color: #191f28; 
            font-size: 24px; 
            font-weight: 700;
            text-align: left;
        }
        
        /* 입력창 그룹화 및 세련된 테두리 */
        .input-group {
            margin-bottom: 12px;
        }

        input { 
            width: 100%; 
            padding: 16px; 
            background-color: #f9fafb;
            border: 1px solid transparent; 
            border-radius: 12px; 
            box-sizing: border-box; 
            font-size: 15px; 
            color: #191f28;
            outline: none; 
            transition: all 0.2s ease;
        }

        /* 마우스를 올리거나 클릭했을 때 토스 블루 색상으로 자연스럽게 전환 */
        input:hover {
            background-color: #f2f4f6;
        }
        input:focus { 
            background-color: #ffffff;
            border-color: #3182f6; 
            box-shadow: 0 0 0 1px #3182f6;
        }
        
        /* 비밀번호 컨테이너 */
        .password-container {
            position: relative;
            margin-bottom: 24px;
            width: 100%;
        }
        .password-container input {
            padding-right: 65px;
        }

        /* 텍스트 형태의 토글 버튼을 투명하고 깔끔하게 디자인 */
        .password-container .toggle-btn {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #8b95a1;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            user-select: none;
            transition: color 0.2s ease;
        }
        .password-container .toggle-btn:hover {
            color: #4e5968;
        }

        /* 토스 시그니처 블루 버튼 스타일 */
        button[type="submit"] { 
            width: 100%; 
            padding: 16px; 
            background-color: #3182f6; 
            color: #ffffff; 
            border: none; 
            border-radius: 12px; 
            font-size: 16px; 
            font-weight: 600; 
            cursor: pointer; 
            box-shadow: 0 4px 12px rgba(49, 130, 246, 0.2);
            transition: all 0.2s ease; 
        }
        /* 버튼 위에 마우스 올렸을 때 살짝 어두워지는 효과 */
        button[type="submit"]:hover { 
            background-color: #1b64da; 
            box-shadow: 0 6px 16px rgba(49, 130, 246, 0.3);
        }
        /* 버튼 클릭 시 꾹 눌리는 듯한 애니메이션 */
        button[type="submit"]:active {
            transform: scale(0.98);
        }
        
        /* 하단 링크 영역: 은은한 회색 톤과 넓은 자간 */
        .links { 
            margin-top: 28px; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            font-size: 13px; 
            gap: 12px; 
        }
        .links a { 
            color: #4e5968; 
            text-decoration: none; 
            font-weight: 500;
            transition: color 0.2s ease;
        }
        .links a:hover { 
            color: #3182f6; 
        }
        /* 세로 구분선 스타일 */
        .links .divider {
            width: 1px;
            height: 12px;
            background-color: #e5e8eb;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>사용자 로그인</h2>
        
        <form id="loginForm">
            <div class="input-group">
                <input type="email" id="loginEmail" placeholder="이메일 주소" required>
            </div>
            
            <div class="password-container">
                <input type="password" id="loginPassword" placeholder="비밀번호" required>
                <span class="toggle-btn" id="togglePassword">보기</span>
            </div>
            
            <button type="submit">로그인</button>
        </form>
        
        <div class="links">
            <a href="register.html">회원가입</a>
            <div class="divider"></div>
            <a href="forgot-email.html">이메일 찾기</a>
            <div class="divider"></div>
            <a href="forgot-password.html">비밀번호 찾기</a>
        </div>
    </div>

    <script>
        // 보기/숨기기 토글 기능
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('loginPassword');

        togglePassword.addEventListener('click', function () {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                this.textContent = '숨기기';
            } else {
                passwordInput.type = 'password';
                this.textContent = '보기';
            }
        });

        // 폼 제출 기능
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault(); 
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            
            if (email && password) {
                alert('로그인이 완료되었습니다!');
            }
        });
    </script>
</body>
</html>
