<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인</title>
    <style>
        /* 기본 배경 및 중앙 정렬 */
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* 로그인 박스 스타일 */
        .login-container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 350px;
            text-align: center;
        }

        h2 {
            margin-bottom: 24px;
            color: #333333;
        }

        /* 입력창 스타일 */
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 16px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }

        input:focus {
            border-color: #007bff;
            outline: none;
        }

        /* 버튼 스타일 */
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background-color: #0056b3;
        }

        /* 링크 스타일 */
        .links {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            font-size: 13px;
        }

        .links a {
            color: #666666;
            text-decoration: none;
        }

        .links a:hover {
            text-decoration: underline;
            color: #007bff;
        }
    </style>
</head>
<body>
    <!--브라우저에 나타나는 내용들-->
    <div class=""login-container">
        <h2>로그인</h2>
        <form action="#">
            <input type="email" placeholder="이메일 주소를 입력하시오" required>
            <input type="password" placeholder="비밀번호를 입력하시오" required>
            <button type="submit">로그인</button>
        </form>
        <div class="links">
            <a href="forgot-email.html">이메일 찾기</a>
            <a href="forgot-password.html">비밀번호 찾기</a>
            <a href="register.html">회원가입</a>
        </div>
    </div>
</body>
</html>
