<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 찾기</title>
    <style>
        /* 타 페이지와 완벽히 통일된 기본 시스템 서체 및 배경 설정 */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "맑은 고딕", helvetica, sans-serif; 
            background-color: #f2f4f6; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            -webkit-font-smoothing: antialiased;
        }

        /* 회원가입창 황금비율인 400px과 통일 */
        .find-container { 
            background-color: #ffffff; 
            padding: 48px 40px; 
            border-radius: 24px; 
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.03); 
            width: 400px; 
            box-sizing: border-box;
        }

        h2 { 
            margin: 0 0 12px 0; 
            color: #191f28; 
            font-size: 24px; 
            font-weight: 700;
            text-align: left;
            line-height: 1.4;
        }

        .subtitle {
            font-size: 14px;
            color: #8b95a1;
            margin: 0 0 32px 0;
            text-align: left;
            line-height: 1.5;
        }
        
        .input-group {
            margin-bottom: 12px;
        }

        input { 
            width: 100%; 
            padding: 16px; 
            background-color: #f9fafb;
            border: 1px solid transparent; 
            border-radius: 12px; 
            box-sizing: border-box; 
            font-size: 15px; 
            color: #191f28;
            outline: none; 
            transition: all 0.2s ease;
        }
        input:hover { background-color: #f2f4f6; }
        input:focus { background-color: #ffffff; border-color: #3182f6; box-shadow: 0 0 0 1px #3182f6; }

        button { 
            width: 100%; 
            padding: 16px; 
            background-color: #3182f6; 
            color: #ffffff; 
            border: none; 
            border-radius: 12px; 
            font-size: 16px; 
            font-weight: 600; 
            cursor: pointer; 
            box-shadow: 0 4px 12px rgba(49, 130, 246, 0.2);
            transition: all 0.2s ease; 
            margin-top: 12px;
        }
        button:hover { background-color: #1b64da; box-shadow: 0 6px 16px rgba(49, 130, 246, 0.3); }
        button:active { transform: scale(0.98); }
        
        .links { margin-top: 28px; display: flex; justify-content: center; align-items: center; font-size: 13px; }
        .links a { color: #4e5968; text-decoration: none; font-weight: 500; transition: color 0.2s ease; }
        .links a:hover { color: #3182f6; }

        /* 💡 2단계: 결과 박스 (기존 이메일 찾기 완료창 디자인 상속) */
        .result-box {
            display: none;
        }
        .hint-display { 
            font-size: 20px; 
            font-weight: 700; 
            color: #3182f6; /* 시그니처 블루 강조 */
            margin: 24px 0; 
            padding: 20px; 
            background-color: #f2f4f6; 
            border-radius: 16px; 
            text-align: center;
            letter-spacing: 2px; /* 글자 간격을 벌려 가독성 확보 */
        }
    </style>
</head>
<body>
    <div class="find-container">
        <!-- 1단계: 이메일 입력 화면 구역 -->
        <div id="search-card">
            <h2>비밀번호 찾기</h2>
            <p class="subtitle">가입 시 등록한 이메일 주소를 입력하시면<br>비밀번호 힌트를 확인하실 수 있습니다.</p>
            
            <form id="findPasswordForm">
                <div class="input-group">
                    <input type="email" id="findEmail" placeholder="이메일 주소" required>
                </div>
                <button type="submit">비밀번호 찾기</button>
            </form>
        </div>

        <!-- 2단계: 결과 안내 화면 구역 (평소에는 display:none) -->
        <div id="result-card" class="result-box">
            <h2>비밀번호 힌트 안내</h2>
            <p class="subtitle" style="margin-bottom: 20px;">정보 보호를 위해 일부 글자가 가려집니다.<br>기억나지 않으시면 다시 확인해 주세요.</p>
            
            <!-- 절반이 마스킹된 비밀번호가 꽂힐 구역 -->
            <div class="hint-display" id="passwordHint"></div>
            
            <button onclick="location.href='index.html'">로그인하러 가기</button>
        </div>
        
        <div class="links">
            <a href="index.html">로그인 화면으로 돌아가기</a>
        </div>
    </div>

    <script>
        document.getElementById('findPasswordForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('findEmail').value.trim();
            const storedUserRaw = localStorage.getItem(`user_${email}`);

            if (!storedUserRaw) {
                alert('등록되지 않은 이메일 주소입니다. 다시 확인해 주세요.');
                return;
            }

            // 가입 데이터 복원
            const userData = JSON.parse(storedUserRaw);
            const rawPassword = userData.password; // 실제 비밀번호 (예: "pass123!")

            // 💡 [핵심 알고리즘] 비밀번호 글자 수의 절반(반올림) 계산
            const halfLength = Math.round(rawPassword.length / 2);
            
            // 앞부분 절반 글자만 쏙 자르기
            const visiblePart = rawPassword.substring(0, halfLength);
            
            // 뒷부분 남은 글자 수만큼 '*' 생성하기
            const maskedPart = '*'.repeat(rawPassword.length - halfLength);
            
            // 두 파트를 합쳐서 힌트 완성 (예: "pass****")
            const finalHint = visiblePart + maskedPart;

            // 결과 화면단에 꽂아주기
            document.getElementById('passwordHint').textContent = finalHint;

            // 1단계 화면 숨기고 2단계 결과창 노출하기
            document.getElementById('search-card').style.display = 'none';
            document.getElementById('result-card').style.display = 'block';
        });
    </script>
</body>
</html>
