<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이메일 찾기</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Malgun Gothic', sans-serif; }
        body { display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f5f6f7; }
        .container { background-color: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 450px; }
        h2 { text-align: center; margin-bottom: 30px; color: #333; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #555; font-size: 14px; }
        select, input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 15px; outline: none; }
        select:focus, input:focus { border-color: #007bff; }
        button { width: 100%; padding: 14px; background-color: #007bff; border: none; border-radius: 4px; color: white; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #0056b3; }
        .result-box { display: none; text-align: center; }
        .result-email { font-size: 20px; font-weight: bold; color: #007bff; margin: 20px 0; padding: 15px; background-color: #e9ecef; border-radius: 4px; }
    </style>
</head>
<body>

<div class="container">
    <!-- 1단계: 질문 및 답변 입력 화면 -->
    <div id="search-card">
        <h2>이메일 찾기</h2>
        <form id="find-form" onsubmit="handleFindEmail(event)">
            <div class="form-group">
                <label for="question">본인 확인 질문</label>
                <select id="question" required>
                    <option value="">질문을 선택해주세요</option>
                    <option value="q1">가장 기억에 남는 선생님 성함은?</option>
                    <option value="q2">처음 키웠던 반려동물의 이름은?</option>
                    <option value="q3">받았던 선물 중 가장 기억에 남는 것은?</option>
                    <option value="q4">자신의 보물 제1호는?</option>
                </select>
            </div>
            <div class="form-group">
                <label for="answer">답변 입력</label>
                <input type="text" id="answer" placeholder="답변을 입력하세요" required>
            </div>
            <button type="submit">이메일 찾기</button>
        </form>
    </div>

    <!-- 2단계: 결과 안내 화면 -->
    <div id="result-card" class="result-box">
        <h2>이메일 찾기 완료</h2>
        <p>입력하신 정보와 일치하는 이메일입니다.</p>
        <div class="result-email" id="user-email">user@example.com</div>
        <button onclick="location.reload()">처음으로</button>
    </div>
</div>

<script>
    function handleFindEmail(event) {
        event.preventDefault(); // 폼 제출 시 새로고침 방지

        const question = document.getElementById('question').value;
        const answer = document.getElementById('answer').value.trim();

        if (answer === "") {
            alert("답변을 입력해주세요.");
            return;
        }

        // 결과 화면에 보여줄 가상의 이메일 데이터
        const foundEmail = "gildong****@naver.com";
        document.getElementById('user-email').innerText = foundEmail;

        // 정상적으로 화면 전환 처리
        document.getElementById('search-card').style.display = 'none';
        document.getElementById('result-card').style.display = 'block';
    }
</script>

</body>
</html>
