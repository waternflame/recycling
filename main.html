<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>대시보드</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, sans-serif; background: #f2f4f6; color: #191f28; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .dashboard-layout { width: 100%; max-width: 400px; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
        .dashboard-card { background: #fff; border-radius: 24px; padding: 28px 24px; box-shadow: 0 12px 40px rgba(0,0,0,0.02); display: flex; align-items: center; justify-content: space-between; width: 100%; border: none; outline: none; text-align: left; }
        
        /* 💡 프로필 및 아바타 전용 미니멀 스타일 */
        .profile-info { display: flex; align-items: center; gap: 16px; }
        .profile-img { width: 60px; height: 60px; border-radius: 50%; background: #e8f3ff; display: flex; justify-content: center; align-items: center; font-size: 32px; cursor: pointer; border: 2px solid #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.05); user-select: none; }
        .profile-text .name { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
        .profile-text .welcome { font-size: 14px; color: #8b95a1; }
        
        .card-title { font-size: 17px; font-weight: 700; color: #4e5968; }
        .point-amount { font-size: 22px; font-weight: 700; color: #3182f6; }
        .btn-card { cursor: pointer; transition: all 0.2s; }
        .btn-card:hover { background: #f9fafb; transform: translateY(-1px); }
        .arrow-icon { font-size: 18px; font-weight: 700; color: #4e5968; }

        /* 💡 아바타 선택용 초간결 모달 스타일 */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #fff; padding: 32px; border-radius: 24px; width: 340px; text-align: center; }
        .avatar-list { display: flex; justify-content: center; gap: 16px; margin: 20px 0; font-size: 36px; }
        .avatar-item { width: 55px; height: 55px; display: flex; justify-content: center; align-items: center; background: #f2f4f6; border-radius: 50%; cursor: pointer; }
    </style>
</head>
<body>

    <main class="dashboard-layout">
        <!-- 1. 프로필 영역 -->
        <section class="dashboard-card">
            <div class="profile-info">
                <div class="profile-img" id="profileImg">🦁</div>
                <div class="profile-text">
                    <div class="name">홍길동</div>
                    <div class="welcome">프로필을 눌러 변경해보세요</div>
                </div>
            </div>
            <button onclick="handleLogout()" style="background:none; border:none; color:#8b95a1; cursor:pointer; font-weight:500;">로그아웃</button>
        </section>

        <!-- 2. 내 적립 포인트 -->
        <section class="dashboard-card">
            <span class="card-title">내 적립 포인트</span>
            <span class="point-amount">1,250 P</span>
        </section>

        <!-- 3. 각종 정보 변경 메뉴 이동 버튼 -->
        <button class="dashboard-card btn-card" onclick="location.href='edit-nickname.html'">
            <span class="card-title">닉네임 변경</span><span class="arrow-icon">➔</span>
        </button>
        <button class="dashboard-card btn-card" onclick="location.href='edit-password.html'">
            <span class="card-title">비밀번호 변경</span><span class="arrow-icon">➔</span>
        </button>
        <button class="dashboard-card btn-card" onclick="location.href='edit-question.html'">
            <span class="card-title">본인확인 질문 변경</span><span class="arrow-icon">➔</span>
        </button>
        <button class="dashboard-card btn-card" onclick="location.href='edit-email.html'">
            <span class="card-title">이메일 변경</span><span class="arrow-icon">➔</span>
        </button>
    </main>

    <!-- 4. 아바타 선택 모달창 -->
    <div id="avatarModal" class="modal">
        <div class="modal-content">
            <h3 style="color:#191f28;">캐릭터 선택</h3>
            <div class="avatar-list">
                <span class="avatar-item">🦁</span>
                <span class="avatar-item">🐱</span>
                <span class="avatar-item">🦊</span>
                <span class="avatar-item">🐻</span>
            </div>
            <button onclick="document.getElementById('avatarModal').style.display='none'" style="width:100%; padding:14px; background:#3182f6; color:#fff; border:none; border-radius:12px; font-weight:600; cursor:pointer;">닫기</button>
        </div>
    </div>

    <script>
        const pImg = document.getElementById('profileImg');
        const modal = document.getElementById('avatarModal');

        // 데이터 복원 로직
        window.addEventListener('DOMContentLoaded', () => {
            const savedName = localStorage.getItem('userNickname');
            if (savedName) document.querySelector('.profile-text .name').textContent = savedName;
            
            const savedAvatar = localStorage.getItem('userAvatar');
            if (savedAvatar) pImg.textContent = savedAvatar;
        });

        // 💡 [압축] 프로필 클릭 시 창 띄우기
        pImg.addEventListener('click', () => modal.style.display = 'flex');

        // 💡 [압축] 이모지 선택 시 실시간 저장 및 교체 처리 (이벤트 위임 방식)
        document.querySelector('.avatar-list').addEventListener('click', (e) => {
            if (e.target.classList.contains('avatar-item')) {
                const emoji = e.target.textContent;
                pImg.textContent = emoji;
                localStorage.setItem('userAvatar', emoji);
                modal.style.display = 'none';
            }
        });

        function handleLogout() {
            if (confirm('로그아웃 하시겠습니까?')) window.location.href = 'index.html';
        }
    </script>
</body>
</html>
