<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대시보드</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "맑은 고딕", helvetica, sans-serif; 
            background-color: #f2f4f6; 
            color: #191f28;
            -webkit-font-smoothing: antialiased;
        }
        .navbar { background-color: #ffffff; padding: 0 24px; height: 60px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #e5e8eb; }
        .navbar .logo { font-size: 20px; font-weight: 800; color: #3182f6; cursor: pointer; }
        .navbar .user-menu { display: flex; align-items: center; gap: 16px; }
        .navbar .logout-btn { font-size: 13px; color: #8b95a1; background: none; border: none; cursor: pointer; font-weight: 500; }
        .navbar .logout-btn:hover { color: #f04452; }

        .dashboard-layout { max-width: 768px; margin: 40px auto; padding: 0 24px; display: flex; flex-direction: column; gap: 16px; }
        .dashboard-card { background-color: #ffffff; border-radius: 24px; padding: 28px 24px; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.02); display: flex; flex-direction: column; width: 100%; }
        .card-title { font-size: 17px; font-weight: 700; color: #4e5968; }
        .card-container { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .point-amount { font-size: 22px; font-weight: 700; color: #3182f6; }

        .profile-section { display: flex; align-items: center; gap: 16px; width: 100%; }
        .profile-img { width: 60px; height: 60px; border-radius: 50%; background: linear-gradient(135deg, #e0e0e0 0%, #b0b0b0 100%); object-fit: cover; border: 2px solid #ffffff; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .profile-text .name { font-size: 20px; font-weight: 700; color: #191f28; margin-bottom: 4px; }
        .profile-text .welcome { font-size: 14px; color: #8b95a1; }

        /* 버튼형 카드 스타일 */
        .btn-card { border: none; outline: none; text-align: left; cursor: pointer; transition: all 0.2s ease; }
        .btn-card:hover { background-color: #f9fafb; transform: translateY(-1px); box-shadow: 0 14px 44px rgba(0, 0, 0, 0.04); }
        .btn-card:active { transform: scale(0.99); }
        .arrow-icon { font-size: 22px; font-weight: 700; color: #8b95a1; user-select: none; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">dashboard</div>
        <div class="user-menu">
            <button class="logout-btn" onclick="handleLogout()">로그아웃</button>
        </div>
    </nav>

    <main class="dashboard-layout">
        <!-- 1. 프로필 영역 -->
        <section class="dashboard-card">
            <div class="profile-section">
                <div class="profile-img-box"><div class="profile-img"></div></div>
                <div class="profile-text">
                    <div class="name">홍길동</div>
                    <div class="welcome">오늘도 좋은 하루 보내세요</div>
                </div>
            </div>
        </section>

        <!-- 2. 내 적립 포인트 -->
        <section class="dashboard-card">
            <div class="card-container">
                <span class="card-title">내 적립 포인트</span>
                <span class="point-amount" id="userPoint">1,250 P</span>
            </div>
        </section>

        <!-- 3. 메뉴 링크 모음 -->
        <button class="dashboard-card btn-card" onclick="location.href='edit-nickname.html'">
            <div class="card-container"><span class="card-title">닉네임 변경</span><span class="arrow-icon">➔</span></div>
        </button>

        <button class="dashboard-card btn-card" onclick="location.href='edit-password.html'">
            <div class="card-container"><span class="card-title">비밀번호 변경</span><span class="arrow-icon">➔</span></div>
        </button>

        <button class="dashboard-card btn-card" onclick="location.href='edit-question.html'">
            <div class="card-container"><span class="card-title">본인확인 질문 변경</span><span class="arrow-icon">➔</span></div>
        </button>

        <button class="dashboard-card btn-card" onclick="location.href='edit-email.html'">
            <div class="card-container"><span class="card-title">이메일 변경</span><span class="arrow-icon">➔</span></div>
        </button>
    </main>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const savedNickname = localStorage.getItem('userNickname');
            const nameElement = document.querySelector('.profile-text .name');
            if (savedNickname && nameElement) { nameElement.textContent = savedNickname; }
        });

        function handleLogout() {
            if (confirm('로그아웃 하시겠습니까?')) {
                alert('로그아웃 되었습니다. 로그인 화면으로 이동합니다.');
                window.location.href = 'index.html';
            }
        }
    </script>
</body>
</html>
