<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>개인정보 변경</title>
    <style>
        /* 타 페이지와 완벽히 통일된 기본 시스템 서체 및 배경 설정 */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "맑은 고딕", helvetica, sans-serif; 
            background-color: #f2f4f6; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            -webkit-font-smoothing: antialiased;
            padding: 20px 0;
        }

        /* 둥글고 입체감 있는 카드 레이아웃 */
        .edit-container { 
            background-color: #ffffff; 
            padding: 48px 40px; 
            border-radius: 24px; 
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.03); 
            width: 360px; 
        }

        /* 타이틀 스타일 */
        h2 { 
            margin: 0 0 12px 0; 
            color: #191f28; 
            font-size: 24px; 
            font-weight: 700;
            text-align: left;
            line-height: 1.4;
        }

        /* 각 섹션 설명용 서브 타이틀 */
        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: #4e5968;
            margin: 24px 0 8px 0;
            text-align: left;
        }
        
        .input-group {
            margin-bottom: 12px;
        }

        /* 입력 폼 공통 스타일 */
        input { 
            width: 100%; 
            padding: 16px; 
            background-color: #f9fafb;
            border: 1px solid transparent; 
            border-radius: 12px; 
            box-sizing: border-box; 
            font-size: 15px; 
            color: #191f28;
            outline: none; 
            transition: all 0.2s ease;
        }

        input:hover {
            background-color: #f2f4f6;
        }

        input:focus { 
            background-color: #ffffff;
            border-color: #3182f6; 
            box-shadow: 0 0 0 1px #3182f6;
        }

        .last-input {
            margin-bottom: 24px;
        }

        /* 메인 행동 버튼 (수정하기) */
        button[type="submit"] { 
            width: 100%; 
            padding: 16px; 
            background-color: #3182f6; 
            color: #ffffff; 
            border: none; 
            border-radius: 12px; 
            font-size: 16px; 
            font-weight: 600; 
            cursor: pointer; 
            box-shadow: 0 4px 12px rgba(49, 130, 246, 0.2);
            transition: all 0.2s ease; 
        }

        button[type="submit"]:hover { 
            background-color: #1b64da; 
            box-shadow: 0 6px 16px rgba(49, 130, 246, 0.3);
        }

        button[type="submit"]:active {
            transform: scale(0.98);
        }

        /* 이전으로 돌아가기 버튼 */
        .btn-back {
            display: block;
            width: 100%;
            padding: 16px;
            background-color: #f2f4f6;
            color: #4e5968;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            margin-top: 12px;
            transition: all 0.2s ease;
        }

        .btn-back:hover {
            background-color: #e5e8eb;
            color: #191f28;
        }

        .btn-back:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div class="edit-container">
        <h2>내 정보 변경</h2>
        
        <form id="editProfileForm">
            <!-- 1. 닉네임 변경 섹션 (required 제거) -->
            <div class="section-title">닉네임 변경</div>
            <div class="input-group">
                <input type="text" id="newNickname" placeholder="새로운 닉네임 입력 (선택)">
            </div>

            <!-- 2. 비밀번호 변경 섹션 (required 및 minlength 제거 후 스크립트로 검증) -->
            <div class="section-title">비밀번호 변경</div>
            <div class="input-group">
                <input type="password" id="newPassword" placeholder="새 비밀번호 (선택)">
            </div>
            <div class="input-group last-input">
                <input type="password" id="newPasswordConfirm" placeholder="새 비밀번호 확인">
            </div>
            
            <button type="submit">변경 내용 저장</button>
            <a href="main.html" class="btn-back">이전으로 돌아가기</a>
        </form>
    </div>

    <script>
        <!-- edit-profile.html 의 기존 코드는 그대로 두고, 맨 아래 <script> 영역만 아래 내용으로 전체 교체해 주세요 -->
    // 페이지가 처음 열릴 때, 기존에 저장된 닉네임이 있다면 입력창에 미리 보여줍니다.
    window.addEventListener('DOMContentLoaded', () => {
        const savedNickname = localStorage.getItem('userNickname');
        if (savedNickname) {
            document.getElementById('newNickname').placeholder = `현재 닉네임: ${savedNickname}`;
        }
    });

    document.getElementById('editProfileForm').addEventListener('submit', function(e) {
        e.preventDefault(); 
        
        const nickname = document.getElementById('newNickname').value.trim();
        const password = document.getElementById('newPassword').value;
        const passwordConfirm = document.getElementById('newPasswordConfirm').value;
        
        if (!nickname && !password && !passwordConfirm) {
            alert('변경할 내용을 입력해 주세요.');
            return;
        }

        let successMessage = "";

        // [핵심 추가] 닉네임 입력 시 브라우저 로컬 스토리지에 가상 저장
        if (nickname) {
            localStorage.setItem('userNickname', nickname);
            successMessage += `닉네임이 [${nickname}](으)로 변경되었습니다.\n`;
        }

        if (password || passwordConfirm) {
            if (password !== passwordConfirm) {
                alert('새 비밀번호가 서로 일치하지 않습니다. 다시 확인해 주세요.');
                return;
            }
            if (password.length < 8) {
                alert('비밀번호는 최소 8자 이상이어야 합니다.');
                return;
            }
            successMessage += "비밀번호가 안전하게 변경되었습니다.\n";
        }
        
        alert(successMessage + '개인정보 변경이 완료되었습니다.');
        window.location.href = 'main.html'; 
    });
    </script>
</body>
</html>
